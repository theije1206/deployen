<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Broodjes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400...700&display=swap"
            rel="stylesheet"
    />
</head>
<body class="panel grid">
    <main class="main">

    <header class="orders-1">
        <h1 class="mobile-heading-03">Broodjes</h1>
    </header>

    <!-- Modal opener toevoegen -->
    <div class="row">
        <a href="#" id="addBread" class="filled-button open-modal">Item toevoegen</a>
    </div>

    <!-- Tabs -->
    <div class="tab-container">
        <a class="tab-button" href="%BASE_URL%admin/modules/catering/">Bestellingen</a>
        <a class="tab-button active">Broodjes</a>
    </div>

    <!-- Broodjes Grid -->
<div id="breadsContainer" class="breads-container">

    <div class="bread">
        <p class="item-name">Frikandel</p>
        <p class="item-price">€2,50</p>
    </div>

    <div class="bread">
        <p class="item-name">Kaasbroodje</p>
        <p class="item-price">€2,50</p>
    </div>

    <div class="bread">
        <p class="item-name">Pistolet</p>
        <p class="item-price">€1,50</p>
    </div>

    <div class="bread">
        <p class="item-name">Croissant</p>
        <p class="item-price">€3,50</p>
    </div>
</div>



<!-- Modal -->
<div id="myModal" class="modal">

  <!-- Modal content -->
  <div class="modal-content">
    <div class="modal-header">
      <span class="close">&times;</span>
      <h2></h2>
    </div>

      <form id="breadform" enctype="multipart/form-data">

      <label for="itemName">Naam:</label>
      <input type="text" id="itemName" name="itemName" required>

      <label for="itemPrice">Prijs:</label>
      <input type="number" id="itemPrice" name="itemPrice" step="0.01" required>

      <div class="modal-buttons">
        <button type="submit" class="submit-button">Opslaan</button>
        <button type="button" class="outlined-button" id="closeModal">Annuleren</button>
      </div>
    </form>
  </div>
</div>


    </main>
    <script type="module" src="main.js"></script>
</body>
</html>
