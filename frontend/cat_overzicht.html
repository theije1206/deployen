<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overzicht</title>
    <link rel="stylesheet" href="Catering.css"> <!-- je CSS bestand -->
</head>

<body>

    <header class="bestellingen-1">
        <h1 class="mobile-heading-03">Overzicht</h1>
    </header>
    <header class="bestellingen-1">
        <h2 class="mobile-heading-04">Maandag 22 Sep</h2>
    </header>

    <div class="bestellingen-1">
        <!-- Knoppen -->
        <div class="row">
            <button class="filled-button">+Item toevoegen</button>
        </div>

        <div class="container row" style="margin-top:16px; width: 420px;">
            <button class="glass-button">Bestellingen</button>
            <button class="glass-button special">Broodjes</button>
        </div>

        <!-- Filters -->
        <div class="row" style="margin-top:16px;">
            <button class="glass-button">Dag</button>
            <button class="glass-button outline">Week</button>
            <button class="glass-button outline">Maand</button>
            <button class="glass-button outline">Jaar</button>
        </div>

        <!-- Tabel -->
        <div class="container" style="margin-top:24px;">
            <table style="width:100%; border-collapse: collapse;">
                <thead>
                    <tr class="row outlined">
                        <th class="mobile-paragraph">Dag</th>
                        <th class="mobile-paragraph">Bestelling</th>
                        <th class="mobile-paragraph">Aantal</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="row">
                        <td>Ma 22 Sep</td>                        
                        <td>#988334</td>
                        <td>75x</td>
                    </tr>
                    <tr class="row">
                        <td>Di 23 Sep</td>                        
                        <td>#655334</td>
                        <td>225x</td>
                    </tr>
                    <tr class="row">
                        <td>Wo 24 Sep</td>
                        <td>#344556</td>
                        <td>75x</td>
                    </tr>
                    
                </tbody>
            </table>
        </div>
    </div>

</body>

</html>
