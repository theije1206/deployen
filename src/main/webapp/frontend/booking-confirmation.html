<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Reservering Bevestigd</title>
</head>
<body>
<h1>Bedankt voor uw reservering!</h1>

<p>Uw reserveringsnummer: <span id="res-id"></span></p>
<p>Aantal kano's: <span id="kano-count"></span></p>
<p>Datum: <span id="rental-date"></span></p>
<p>Tijd: <span id="rental-time"></span></p>
<p>Duur: <span id="rental-duration"></span></p>
<p>Naam: <span id="name"></span></p>
<p>Telefoon: <span id="phone"></span></p>
<p>Email: <span id="email"></span></p>

<a href="/kanoverhuur.html">Terug naar home</a>

<script>
    async function fetchReservationInfo() {
        try {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            if (!id) throw new Error("Geen reserverings-ID gevonden");

            const response = await fetch(`/api/product-reservations/${id}`);
            if (!response.ok) throw new Error("Serverfout");

            const reservation = await response.json();

            document.getElementById("res-id").textContent = reservation.id;
            document.getElementById("kano-count").textContent = reservation.kanoCount;
            document.getElementById("rental-date").textContent = reservation.rentalDate;
            document.getElementById("rental-time").textContent = reservation.rentalTime;
            document.getElementById("rental-duration").textContent = reservation.rentalDuration;
            document.getElementById("name").textContent = reservation.name;
            document.getElementById("phone").textContent = reservation.phone;
            document.getElementById("email").textContent = reservation.email;

        } catch (error) {
            console.error(error);
            document.body.insertAdjacentHTML('beforeend', `<p style="color:red;">${error.message}</p>`);
        }
    }

    fetchReservationInfo();
</script>
</body>
</html>
