<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kano Verhuur</title>
</head>
<body>
    <link rel="stylesheet" href="src/styles/kanoverhuur.css" />

<header>
    <h1>Kano Verhuur</h1>
    <p>Hier kunt u de beste kano's huren</p>
</header>

<form id="renting-list">

    <label for="kano-type">Kies een kano type:</label>
    <select id="kano-type" required>
        <option value="">-- Selecteer een kano --</option>
    </select>

    <div>
        <label for="kano-count">Aantal kano's:</label>
        <select id="kano-count">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>

    <div>
        <label for="start">Datum:</label>
        <input type="date" id="start" required />

        <label for="rental-time">Tijd:</label>
        <input type="time" id="rental-time" min="09:00" max="18:00" required />
    </div>

    <div>
        <label for="duration-select">Duur van de huur:</label>
        <select id="duration-select">
            <option value="1">1 uur</option>
            <option value="2">2 uur</option>
            <option value="3">3 uur</option>
            <option value="4">4 uur</option>
            <option value="5">5 uur</option>
        </select>
    </div>

    <fieldset>
        <legend>Persoonlijke gegevens</legend>

        <label for="name-info">Naam:</label>
        <input type="text" id="name-info" required />

        <label for="contact-info">Telefoonnummer:</label>
        <input type="text" id="contact-info" required />

        <label for="email-info">E-mail:</label>
        <input type="email" id="email-info" required />
    </fieldset>

    <button type="submit">Verhuur aanvragen</button>
</form>

<script>
    async function fetchProducts() {
        try {
            const response = await fetch("/api/products");
            if (!response.ok) throw new Error("Producten niet beschikbaar");
            return await response.json();
        } catch (error) {
            console.error(error);
            return [];
        }
    }

    async function loadKanoOptions() {
        const products = await fetchProducts();
        const select = document.getElementById("kano-type");

        products.forEach(product => {
            const option = document.createElement("option");
            option.value = product.id;
            option.textContent =
                `${product.naam} - €${product.prijs} - ${product.capaciteit} personen`;
            select.appendChild(option);
        });
    }

    loadKanoOptions();

    async function submitRentingList(event) {
        event.preventDefault();

        const rentalData = {
            productId: Number(document.getElementById("kano-type").value),
            kanoCount: Number(document.getElementById("kano-count").value),
            rentalDate: document.getElementById("start").value,
            rentalTime: document.getElementById("rental-time").value,
            rentalDuration: Number(document.getElementById("duration-select").value),
            name: document.getElementById("name-info").value.trim(),
            phone: document.getElementById("contact-info").value.trim(),
            email: document.getElementById("email-info").value.trim()
        };

        try {
            const response = await fetch("/api/product-reservations", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(rentalData)
            });

            if (!response.ok) {
                const text = await response.text();
                throw new Error(text);
            }

            const savedReservation = await response.json();

            window.location.href =
                `/frontend/booking-confirmation.html?id=${savedReservation.id}`;

        } catch (error) {
            console.error(error);
            alert("Fout bij het indienen van de reservering.");
        }
    }

    document
        .getElementById("renting-list")
        .addEventListener("submit", submitRentingList);
</script>

</body>
</html>
