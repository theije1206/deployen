<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400...700&display=swap"
            rel="stylesheet"
    />
  <script type="module" crossorigin src="/cms_war_exploded/assets/admin/index-DumEz-Tp.js"></script>
  <link rel="modulepreload" crossorigin href="/cms_war_exploded/assets/global-BXAEBsWw.js">
  <link rel="stylesheet" crossorigin href="/cms_war_exploded/assets/global-BzszITMc.css">
  <link rel="stylesheet" crossorigin href="/cms_war_exploded/assets/index-5DvNP0mu.css">
</head>
<body class="panel grid">
<main class="main">
    <div class="dashboard-container">
        <header class="top">
            <h1 class="title">Dashboard</h1>
            <input type="date" class="date">
        </header>

        <div class="dashboard">

            <div class="frame frame1" id="reservationsFrame"
                 onclick="location.href='/reserveringen'">
                <h2>Reserveringen</h2>
                <div class="chart-wrapper">
                    <canvas id="reservationsChart"></canvas>
                </div>
            </div>


            <div class="frame frame2" onclick="location.href='/beschikbaarheid'">
                <div id="availabillity">
                    <h2>Beschikbaar</h2>
                    <ul id="availList"></ul>
                </div>
            </div>

            <div class="frame frame3" onclick="location.href='/sanitair'">
                <div id="messages">
                    <h2>Berichten</h2>
                    <p> Ongelezen berichten : <span id="unreadCount"></span></p>
                </div>
            </div>

            <div class="frame frame4" onclick="location.href='/catering'">
                <div id="catering">
                    <h2>Catering</h2>
                    <ul id="catList"></ul>
                </div>
            </div>

            <div class="frame frame5" onclick="location.href='/factuur'">
                <div id="invoice">
                    <h2>Factuur</h2>
                    <p>Volgende factuur datum <span id="invoiceDate"></span> - €<span
                            id="invoiceAmount"></span></p>
                </div>
            </div>


            <div class="frame frame6" onclick="location.href='/omzet'">
                <div id="turnover">
                    <h2>Omzet</h2>
                    <p>€<span id="turnoverAmount"></span></p>
                </div>
            </div>
        </div>
    </div>

</main>


</body>
</html>
